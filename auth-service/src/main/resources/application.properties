spring.application.name=auth-service
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flowboard_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
app.jwt.secret=Zmxvd2JvYXJkLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbg==
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Frontend URL (OAuth2 redirect)
app.frontend.url=${ANGULAR_API_URL:http://localhost:4200}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.default-admin.full-name=${DEFAULT_ADMIN_FULL_NAME:Platform Administrator}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Kafka Configuration
spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans,mappings,threaddump
management.endpoint.health.show-details=always
management.endpoint.loggers.enabled=true
management.endpoint.env.enabled=true

# OAuth2 diagnostics
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web.client=DEBUG

# Async
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4

# Eureka client registration
eureka.client.service-url.defaultZone=http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka-secret}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.metadata-map.management.port=${server.port}

# Spring Boot Admin client
spring.boot.admin.client.enabled=true
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://localhost:9090}
management.health.mail.enabled=false
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8089/api/v1/internal/payments}
