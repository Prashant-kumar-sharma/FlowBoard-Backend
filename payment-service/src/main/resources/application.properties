spring.application.name=payment-service
server.port=8089

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/flowboard_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL:10m}
spring.cache.redis.cache-null-values=false

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_flowboard}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:test_secret}
payment.razorpay.api-base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
payment.plan.premium-amount-paise=${PREMIUM_AMOUNT_PAISE:29900}
payment.plan.currency=${PREMIUM_CURRENCY:INR}
payment.plan.workspace-limit=${FREE_WORKSPACE_LIMIT:5}
payment.plan.member-limit=${FREE_MEMBER_LIMIT:5}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true
spring.boot.admin.client.url=${ADMIN_SERVER_URL:http://localhost:9090}
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.redis.enabled=false
