name: Backend Deploy

on:
  push:
    branches:
      - main
      - dev
      - feature/**
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: prashar85211

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      MAIL_USERNAME: ci-mail-user@example.com
      MAIL_PASSWORD: ci-mail-password
      MAIL_FROM: ci-mail-from@example.com
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:29092
      JWT_SECRET: 12345678901234567890123456789012

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven verify
        run: mvn -B clean verify

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-server
          - api-gateway
          - auth-service
          - board-service
          - card-service
          - comment-service
          - eureka-server
          - label-service
          - list-service
          - notification-service
          - payment-service
          - workspace-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/flowboard-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.SERVER_APP_PATH }}"
            git pull origin main
            docker compose pull
            docker compose up -d --no-build --remove-orphans
